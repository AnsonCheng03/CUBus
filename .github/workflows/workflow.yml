name: Validate and deploy Expo web

on:
  push:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - name: Install Packages
        run: npm ci --prefix mobile
      - name: Typecheck
        run: npm --prefix mobile run typecheck
      - name: Unit and shared-core tests
        run: npm --prefix mobile run test:unit && npm --prefix mobile run test:shared-core
      - name: Install Playwright
        run: npx --prefix mobile playwright install --with-deps chromium
      - name: Web end-to-end tests
        run: npm --prefix mobile run test:e2e:web
      - name: Export Expo web
        run: npm --prefix mobile run build:web
      - name: Deploy🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: mobile/dist
